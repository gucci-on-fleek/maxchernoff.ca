# To mount the root and ESP
filesystems+=" btrfs vfat "

# For debugging and rescue
add_dracutmodules+=" busybox "

# For more readable colours
add_dracutmodules+=" custom-colors "

# Generate a "generic" initramfs
hostonly="no"

# Aggressive compression
compress="zstd"
do_strip="yes"
aggressive_strip="yes"
do_hardlink="yes"
