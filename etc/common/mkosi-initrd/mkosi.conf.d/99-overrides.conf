[Content]
# Fully override the package list
Packages=
Packages=
    bootc
    btrfs-progs
    busybox
    clevis-luks
    clevis-systemd
    cryptsetup
    dosfstools
    less
    libseccomp
    procps-ng
    systemd
    systemd-networkd
    systemd-pam
    systemd-resolved
    tpm2-tss
    udev
    util-linux-core

RemovePackages=
    e2fsprogs
    xfsprogs

# Remove some unneeded kernel modules.
KernelModules=
    -autofs4
    -binfmt_misc
    -cdrom
    -dm-integrity
    -dm-mod
    -dm-multipath
    -dm-raid
    -dm-verity
    -ext4
    -hid-generic
    -raid[0-9]*
    -snd-intel-dspcfg
    -snd-soc-hda-codec
    -squashfs
    -thunderbolt_net
    -uvc
    -videobuf2-v4l2
    -videobuf2-vmalloc
    -virtio_balloon
    -xfs
    -zram

# Add some additional kernel modules.
KernelModules=
    softdog
    overlay
    erofs

# Add files from the host.
ExtraTrees=
    /etc/systemd/system:/etc/systemd/system
    /usr/local/:/usr/local/
    /usr/lib/userdb/:/usr/lib/userdb/

# Remove useless files.
RemoveFiles=
    /etc/pki/
    /usr/lib/.build-id/
    /usr/share/bash-completion/
    /usr/share/licenses/
    /usr/share/pki/
    /usr/share/terminfo/[0-k]*
    /usr/share/terminfo/[m-z]*
    /usr/share/zsh/

# Maximum compression.
[Output]
CompressOutput=zstd
CompressLevel=19
