[Output]
# Maximum compression.
CompressOutput=zstd
CompressLevel=19

# Produce an initramfs image.
Output=initrd
Format=cpio

[Content]
Bootable=no
MakeInitrd=yes

# Minimize the package data installed.
CleanPackageMetadata=yes
Locale=C.UTF-8
WithDocs=no

# Install the listed packages into the initrd.
Packages=
    # Basic requirements.
    systemd
    udev
    libseccomp

    # Needed to decrypt the root filesystem.
    clevis-systemd
    clevis-luks
    systemd-cryptsetup

    # Clevis+Tang needs network access.
    systemd-networkd
    systemd-resolved

    # Needed to mount the root filesystem.
    bootc
    btrfs-progs

    # Needed to mount the EFI system partition.
    dosfstools

    # Make debugging easier.
    busybox
    less
    systemd-pam

# Add some kernel modules.
KernelModules=
    default
    softdog
    overlay
    erofs
    -autofs4
    -binfmt_misc
    -cdrom
    -dm-integrity
    -dm-mod
    -dm-multipath
    -dm-raid
    -dm-verity
    -ext4
    -hid-generic
    -raid[0-9]*
    -snd-intel-dspcfg
    -snd-soc-hda-codec
    -squashfs
    -thunderbolt_net
    -uvc
    -videobuf2-v4l2
    -videobuf2-vmalloc
    -virtio_balloon
    -xfs
    -zram

# Add files from the host.
ExtraTrees=
    /usr/lib/userdb/:/usr/lib/userdb/

# Remove useless files.
RemoveFiles=
    # Empty directories.
    /afs/
    /media/
    /srv/

    # Build artifacts.
    /buildroot/

    # Folders with too many files.
    /etc/pki/
    /usr/lib/.build-id/
    /usr/share/bash-completion/
    /usr/share/pki/
    /usr/share/zsh/

    # Not used in the initrd.
    /usr/lib/dracut/
    /usr/bin/podman
    /usr/bin/skopeo

    # Keep only the "linux" framebuffer terminfo files.
    /usr/share/terminfo/[0-k]*
    /usr/share/terminfo/[m-z]*

    # Copied from the default mkosi.conf file.
    /usr/lib/systemd/catalog
    /etc/udev/hwdb.d
    /usr/lib/udev/hwdb.d
    /etc/services
    /usr/lib/modules/*/vmlinuz*
    /usr/lib/modules/*/vmlinux*
    /usr/lib/modules/*/System.map
    /var/cache
    /var/log
