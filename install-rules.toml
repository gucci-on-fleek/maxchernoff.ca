#################
### Variables ###
#################

[variables]
builder = "/var/home/builder/"
etc = "/etc/"
max = "/var/home/max/"
repo = "/var/home/repo/maxchernoff.ca/"
repo-user = "/var/home/repo/"
tex = "/var/home/tex/"
web = "/var/home/web/"
woodpecker = "/var/home/woodpecker/"


###############
### SELinux ###
###############

[selinux]
path = "/usr/local/share/selinux/semanage.import"


############
### repo ###
############

[[permissions]]
base = "{repo-user}"
paths = ["*"]
owner = "repo"
permissions.other = ""

[[permissions]]
base = "/var/home/"
paths = ["repo/", "repo/maxchernoff.ca/", "repo/triggers/"]
owner = "repo"
permissions.other = "r"

[[permissions]]
base = "{repo}"
paths = ["*"]
owner = "repo"
permissions.other = "r"
recursive_permissions = true

[[permissions]]
base = "{repo}/"
paths = [".git*", "install-rules.toml"]
owner = "repo"
permissions.other = ""
recursive_permissions = true

[[permissions]]
base = "{repo}/"
paths = [".git"]
owner = "repo"
permissions.other = "r"
recursive_permissions = false

[[permissions]]
base = "{repo}/.git/"
paths = ["packed-refs", "HEAD", "refs/", "config", "objects/"]
owner = "repo"
permissions.other = "r"
recursive_permissions = true

[[folder]]
base = "{repo-user}"
paths = ["triggers"]
owner = "repo"
permissions.other = "r"

[[touch]]
base = "{repo-user}/triggers/"
paths = [
    "install-repo-maxchernoff.ca.trigger",
    "get-status.trigger",
    "get-status.output",
]
owner = "repo"
permissions.max = "rw"
permissions.root = "rw"
permissions."web/1000" = "rw"
permissions.other = ""


###########
### etc ###
###########

[[copy]]
source = "{repo}/etc/common/"
destination = "{etc}/"
paths = ["**/*"]
owner = "root"
permissions.other = "r"

[[copy]]
if = { hostname = "maxchernoff.ca" }
source = "{repo}/etc/maxchernoff.ca/"
destination = "{etc}/"
paths = ["**/*"]
owner = "root"
permissions.other = "r"


###########
### usr ###
###########

[[copy]]
source = "{repo}/usr/local/"
destination = "/usr/local/"
paths = ["**/*"]
owner = "root"
permissions.other = "r"


###########
### max ###
###########

[[permissions]]
base = "{max}"
paths = ["*"]
owner = "max"
permissions.other = ""

[[copy]]
source = "{repo}/max/"
destination = "{max}/"
paths = [".ssh/known_hosts", ".config/fish/config.fish"]
owner = "max"

# Risky, so we keep this commented out most of the time
# [[copy]]
# source = "{repo}/max/"
# destination = "{max}/"
# paths = [".ssh/authorized_keys"]
# owner = "max"

[[link]]
source = "{repo}/max/"
destination = "{max}/"
paths = [".config/containers/"]
owner = "max"


###########
### tex ###
###########

[[permissions]]
if = { hostname = "maxchernoff.ca" }
base = "{tex}"
paths = ["*"]
owner = "tex"
permissions.other = ""

[[permissions]]
if = { hostname = "maxchernoff.ca" }
base = "{repo}"
paths = ["tex/"]
owner = "repo"
permissions.tex = "r"
recursive_permissions = true

[[link]]
if = { hostname = "maxchernoff.ca" }
source = "{repo}/tex/"
destination = "{tex}/"
paths = [
    ".config/containers/",
    ".config/systemd/user/",
    ".config/user-tmpfiles.d",
]
owner = "tex"

[[permissions]]
if = { hostname = "maxchernoff.ca" }
base = "{tex}"
paths = ["texlive/", "context-installer/tex/", "context/"]
owner = "tex"
permissions.other = "r"
recursive_permissions = false # Too slow to set permissions on all files


###########
### web ###
###########

[[permissions]]
if = { hostname = "maxchernoff.ca" }
base = "{web}"
paths = ["*"]
owner = "web"
permissions.other = ""

[[permissions]]
if = { hostname = "maxchernoff.ca" }
base = "{repo}"
paths = ["web/"]
owner = "repo"
permissions.web = "r"
recursive_permissions = true

[[link]]
if = { hostname = "maxchernoff.ca" }
source = "{repo}/web/"
destination = "{web}/"
paths = [
    ".config/containers/",
    ".config/prometheus-podman-exporter",
    ".config/systemd/user/",
    ".config/user-tmpfiles.d",
]
permissions.web = "r"
owner = "root"

[[link]]
if = { hostname = "maxchernoff.ca" }
source = "{repo}/web/"
destination = "{web}/"
paths = [
    "caddy/*/",
    "dnscontrol",
    "flask",
    "goaccess",
    "knot/*/",
    "maddy/config",
    "grafana/config",
    "container-registry/config",
    "dmarc-metrics/config",
    "victoria-metrics/config",
]
permissions.web = "r"
permissions."web/root" = "r"
permissions."web/1000" = "r"
permissions."web/53" = "r"
permissions.max = "rw"
owner = "web"

[[folder]]
if = { hostname = "maxchernoff.ca" }
base = "{web}"
paths = [
    "caddy/config/",
    "caddy/data/",
    "caddy/logs/",
    "overleaf/overleaf/",
    "woodpecker/data/",
]
owner = "web/root"
permissions.web = "rw"

[[folder]]
if = { hostname = "maxchernoff.ca" }
base = "{web}"
paths = ["overleaf/redis/", "overleaf/mongo/"]
owner = "web/root"
permissions."web/999" = "rw"
permissions."web/root" = "rw"
permissions.web = "rw"
recursive_permissions = true

[[folder]]
if = { hostname = "maxchernoff.ca" }
base = "{web}"
paths = ["overleaf/overleaf/"]
owner = "web"
permissions."web/33" = "rw"

[[permissions]]
if = { hostname = "maxchernoff.ca" }
base = "{web}/caddy/"
paths = ["etc/", "static/"]
permissions."web/root" = "r"
permissions."web" = "r"
owner = "repo"
recursive_permissions = true

[[folder]]
if = { hostname = "maxchernoff.ca" }
base = "{web}/caddy/static/tools/"
paths = ["context-wiki/"]
permissions."web/root" = "rw"
permissions."web" = "rw"
owner = "web"
recursive_permissions = false

[[folder]]
if = { hostname = "maxchernoff.ca" }
base = "{web}/caddy/"
paths = ["context-wiki/"]
permissions."web/root" = "r"
permissions."web" = "rw"
owner = "web"
recursive_permissions = false

[[touch]]
if = { hostname = "maxchernoff.ca" }
base = "{web}/caddy/"
paths = [
    "static/analytics/requests.tsv",
    "static/analytics/graphs",
    "logs/access.log",
]
permissions."web/root" = "rw"
permissions.web = "rw"
permissions.max = "r"
owner = "web/root"

[[permissions]]
