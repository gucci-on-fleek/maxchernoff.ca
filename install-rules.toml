#################
### Variables ###
#################

[variables]
builder    = "/var/home/builder/"
etc        = "/etc/"
repo       = "/var/lib/repo/"
tex        = "/var/lib/tex/"
web        = "/var/home/web/"
woodpecker = "/var/home/woodpecker/"


###############
### SELinux ###
###############

[selinux]
path = "/usr/local/share/selinux/semanage.import"


############
### repo ###
############

[[permissions]]
base                  = "{repo}"
paths                 = ["*"]
owner                 = "repo"
permissions.other     = "r"
recursive_permissions = true

[[permissions]]
base                  = "{repo}/"
paths                 = [".git*", "install-rules.toml"]
owner                 = "repo"
permissions.other     = ""
recursive_permissions = true

[[permissions]]
base                  = "{repo}/"
paths                 = [".git"]
owner                 = "repo"
permissions.other     = "r"
recursive_permissions = false

[[permissions]]
base                  = "{repo}/.git/"
paths                 = ["packed-refs", "HEAD", "refs/", "config", "objects/"]
owner                 = "repo"
permissions.other     = "r"
recursive_permissions = true


###########
### etc ###
###########

[[copy]]
source            = "{repo}/etc/"
destination       = "{etc}/"
paths             = ["**/*"]
owner             = "root"
permissions.other = "r"


###########
### usr ###
###########

[[copy]]
source            = "{repo}/usr/local/"
destination       = "/usr/local/"
paths             = ["**/*"]
owner             = "root"
permissions.other = "r"


###########
### tex ###
###########

[[permissions]]
base                  = "{tex}"
paths                 = ["texlive/", "context-installer/tex/", "context/"]
owner                 = "tex"
permissions.other     = "r"
recursive_permissions = false                                              # Too slow to set permissions on all files


###########
### web ###
###########

[[permissions]]
if                = { hostname = "maxchernoff.ca" }
base              = "{web}"
paths             = ["*"]
owner             = "web"
permissions.other = ""

[[permissions]]
if                    = { hostname = "maxchernoff.ca" }
base                  = "{repo}"
paths                 = ["web/"]
owner                 = "repo"
permissions.web       = "r"
recursive_permissions = true

# [[link]]
# if = { hostname = "maxchernoff.ca" }
# source = "{repo}/web/"
# destination = "{web}/"
# paths = [
#     ".config/systemd/user/",
#     ".config/user-tmpfiles.d",
# ]
# permissions.web = "r"
# owner = "root"

[[link]]
if = { hostname = "maxchernoff.ca" }
source = "{repo}/web/"
destination = "{web}/"
paths = [
    "caddy/*/",
    "dnscontrol",
    "flask",
    "goaccess",
    "knot/*/",
    "maddy/config",
    "grafana/config",
    "container-registry/config",
    "dmarc-metrics/config",
    "victoria-metrics/config",
]
permissions.web = "r"
permissions."web/root" = "r"
permissions."web/1000" = "r"
permissions."web/53" = "r"
permissions.max = "rw"
owner = "web"

[[folder]]
if = { hostname = "maxchernoff.ca" }
base = "{web}"
paths = [
    "caddy/config/",
    "caddy/data/",
    "caddy/logs/",
    "overleaf/overleaf/",
    "woodpecker/data/",
]
owner = "web/root"
permissions.web = "rw"

[[folder]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "{web}"
paths                  = ["overleaf/redis/", "overleaf/mongo/"]
owner                  = "web/root"
permissions."web/999"  = "rw"
permissions."web/root" = "rw"
permissions.web        = "rw"
recursive_permissions  = true

[[folder]]
if                   = { hostname = "maxchernoff.ca" }
base                 = "{web}"
paths                = ["overleaf/overleaf/"]
owner                = "web"
permissions."web/33" = "rw"

[[permissions]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "{web}/caddy/"
paths                  = ["etc/", "static/"]
permissions."web/root" = "r"
permissions."web"      = "r"
owner                  = "repo"
recursive_permissions  = true

[[folder]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "{web}/caddy/static/tools/"
paths                  = ["context-wiki/"]
permissions."web/root" = "rw"
permissions."web"      = "rw"
owner                  = "web"
recursive_permissions  = false

[[folder]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "{web}/caddy/"
paths                  = ["context-wiki/"]
permissions."web/root" = "r"
permissions."web"      = "rw"
owner                  = "web"
recursive_permissions  = false

[[touch]]
if = { hostname = "maxchernoff.ca" }
base = "{web}/caddy/"
paths = [
    "static/analytics/requests.tsv",
    "static/analytics/graphs",
    "logs/access.log",
]
permissions."web/root" = "rw"
permissions.web = "rw"
permissions.max = "r"
owner = "web/root"

[[permissions]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "{web}/woodpecker/"
paths                  = ["data/"]
permissions."web/1000" = "rw"
permissions.web        = "rw"
owner                  = "web/1000"
recursive_permissions  = true

[[permissions]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "{web}/"
paths                  = ["flask"]
owner                  = "repo"
permissions."web/1000" = "r"
permissions.web        = "rw"
recursive_permissions  = true

[[permissions]] # For scp
