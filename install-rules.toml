###############
### builder ###
###############

[[permissions]]
if = { hostname = "maxchernoff.ca" }
base = "{builder}"
paths = ["*"]
owner = "builder"
permissions.other = ""

[[permissions]]
if = { hostname = "maxchernoff.ca" }
base = "{repo}"
paths = ["builder/"]
owner = "repo"
permissions.builder = "r"
recursive_permissions = true

[[link]]
if = { hostname = "maxchernoff.ca" }
source = "{repo}/builder/"
destination = "{builder}/"
paths = [
    ".config/containers/",
    ".config/prometheus-podman-exporter",
    ".config/systemd/user/",
    ".config/user-tmpfiles.d",
    "containers/",
]
