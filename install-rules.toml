###############
### builder ###
###############

[[permissions]]
if                = { hostname = "maxchernoff.ca" }
base              = "{builder}"
paths             = ["*"]
owner             = "builder"
permissions.other = ""

[[permissions]]
if                    = { hostname = "maxchernoff.ca" }
base                  = "{repo}"
paths                 = ["builder/"]
owner                 = "repo"
permissions.builder   = "r"
recursive_permissions = true

[[link]]
if                  = { hostname = "maxchernoff.ca" }
source              = "{repo}/builder/"
destination         = "{builder}/"
paths               = [".config/systemd/user/", "containers/"]
permissions.builder = "r"

[[folder]]
if    = { hostname = "maxchernoff.ca" }
base  = "{builder}/.cache/"
paths = ["podman-dnf/", "go-build/", "go-modules/", "rpm-ostree/"]
owner = "builder"

[[permissions]]
if                  = { hostname = "maxchernoff.ca" }
base                = "{builder}/.cache/"
paths               = ["go-modules"]
permissions.builder = "rw"
permissions.other   = "r"
