#################
### Variables ###
#################

[variables]


###############
### SELinux ###
###############

[selinux]
path = "/usr/local/share/selinux/semanage.import"


############
### repo ###
############

[[permissions]]
base                  = "/var/lib/repo/"
paths                 = ["*"]
owner                 = "repo"
permissions.other     = "r"
recursive_permissions = true

###########
### etc ###
###########

[[copy]]
source                = "/var/lib/repo/etc/"
destination           = "/etc/"
paths                 = ["**/*"]
owner                 = "root"
permissions.other     = "r"
recursive_permissions = true


###########
### usr ###
###########

[[copy]]
source                = "/var/lib/repo/usr/local/"
destination           = "/usr/local/"
paths                 = ["**/*"]
owner                 = "root"
permissions.other     = "r"
recursive_permissions = true


###########
### web ###
###########

[[permissions]]
if                = { hostname = "maxchernoff.ca" }
base              = "/var/home/web/"
paths             = ["*"]
owner             = "web"
permissions.other = ""

[[folder]]
if = { hostname = "maxchernoff.ca" }
base = "/var/home/web/data/"
paths = [
    "caddy/config/",
    "caddy/data/",
    "caddy/logs/",
    "overleaf/overleaf/",
    "woodpecker/data/",
]
owner = "web/root"
permissions.web = "rw"

[[folder]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "/var/home/web/data/"
paths                  = ["overleaf/redis/", "overleaf/mongo/"]
owner                  = "web/root"
permissions."web/999"  = "rw"
permissions."web/root" = "rw"
permissions.web        = "rw"
recursive_permissions  = true

[[folder]]
if                   = { hostname = "maxchernoff.ca" }
base                 = "/var/home/web/data/"
paths                = ["overleaf/overleaf/"]
owner                = "web"
permissions."web/33" = "rw"

[[folder]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "/var/home/web/caddy/static/tools/"
paths                  = ["context-wiki/"]
permissions."web/root" = "rw"
permissions."web"      = "rw"
owner                  = "web"
recursive_permissions  = false

[[folder]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "/var/home/web/data/caddy/"
paths                  = ["context-wiki/"]
permissions."web/root" = "r"
permissions."web"      = "rw"
owner                  = "web"
recursive_permissions  = false

[[touch]]
if = { hostname = "maxchernoff.ca" }
base = "/var/home/web/data/caddy/"
paths = [
    "static/analytics/requests.tsv",
    "static/analytics/graphs",
    "logs/access.log",
]
permissions."web/root" = "rw"
permissions.web = "rw"
permissions.max = "r"
owner = "web/root"

[[permissions]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "/var/home/web/data/woodpecker/"
paths                  = ["data/"]
permissions."web/1000" = "rw"
permissions.web        = "rw"
owner                  = "web/1000"
recursive_permissions  = true

[[permissions]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "/var/home/web/data/"
paths                  = ["flask"]
owner                  = "repo"
permissions."web/1000" = "r"
permissions.web        = "rw"
recursive_permissions  = true

[[folder]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "/var/home/web/data/"
paths                  = ["knot/storage/"]
owner                  = "web"
permissions.web        = "rw"
permissions."web/53"   = "rw"
permissions."web/root" = "rw"

[[permissions]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "/var/home/web/data/caddy/"
paths                  = ["logs/"]
owner                  = "web"
permissions.web        = "rw"
permissions."web/root" = "rw"
permissions.max        = "r"
recursive_permissions  = true

[[folder]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "/var/home/web/data/"
paths                  = ["maddy/data/"]
owner                  = "web"
permissions.web        = "rw"
permissions."web/1000" = "rw"

[[folder]]
if                    = { hostname = "maxchernoff.ca" }
base                  = "/var/home/web/data/grafana/"
paths                 = ["data"]
owner                 = "web"
permissions.web       = "rw"
permissions."web/472" = "rw"

[[folder]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "/var/home/web/data/dmarc-metrics/"
paths                  = ["data"]
owner                  = "web"
permissions.web        = "rw"
permissions."web/1000" = "rw"

[[folder]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "/var/home/web/data/victoria-logs/"
paths                  = ["data"]
owner                  = "web"
permissions.web        = "rw"
permissions."web/1000" = "rw"

[[folder]]
if                     = { hostname = "maxchernoff.ca" }
base                   = "/var/home/web/data/victoria-metrics/"
paths                  = ["data"]
owner                  = "web"
permissions.web        = "rw"
permissions."web/1000" = "rw"


##################
### woodpecker ###
##################

[[permissions]]
if                            = { hostname = "maxchernoff.ca" }
base                          = "/var/home/woodpecker/data/woodpecker/"
paths                         = ["config/"]
permissions."woodpecker/1000" = "rw"
permissions.woodpecker        = "rw"
owner                         = "woodpecker/1000"
recursive_permissions         = true


###############
### builder ###
###############

[[folder]]
if    = { hostname = "maxchernoff.ca" }
base  = "/var/home/builder/.cache/"
paths = ["podman-dnf/", "go-build/", "go-modules/", "rpm-ostree/"]
owner = "builder"

[[permissions]]
if                  = { hostname = "maxchernoff.ca" }
base                = "/var/home/builder/.cache/"
paths               = ["go-modules"]
permissions.builder = "rw"
permissions.other   = "r"
