##################
### woodpecker ###
##################

[[permissions]]
if                = { hostname = "maxchernoff.ca" }
base              = "{woodpecker}"
paths             = ["*"]
owner             = "woodpecker"
permissions.other = ""

[[folder]]
if    = { hostname = "maxchernoff.ca" }
base  = "{woodpecker}"
paths = ["woodpecker/config/"]
owner = "woodpecker"

[[permissions]]
if                            = { hostname = "maxchernoff.ca" }
base                          = "{woodpecker}/woodpecker/"
paths                         = ["config/"]
permissions."woodpecker/1000" = "rw"
permissions.woodpecker        = "rw"
