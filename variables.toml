[network]
# The IP addresses for each server
hydrogen.ipv4 = "152.53.36.213"
hydrogen.ipv6 = "2a0a:4cc0:2000:172::1"

helium.ipv4 = "152.53.243.123"
helium.ipv6 = "2a0a:4cc0:2000:82b7::1"

lithium.ipv4 = "185.99.135.233"
lithium.ipv6 = "2a0d:d907:3::1552:1"

boron.ipv4 = "216.18.193.121"
boron.ipv6 = "2607:f2d8:401b:11f1::a"

carbon.ipv4 = "149.56.240.225"
carbon.ipv6 = "2a11:6c7:2600:9132::2"


[woodpecker]
# The port used by the Woodpecker agent to communicate with the Woodpecker
# server
port = "40144"


[registry]
# The port used to push/write to the container registry
port = "23719"


[fedora]
# The version of Fedora to use for all container images
version = "45"


[dns]
# The alternate port that the DNS server will listen on
altport = "25108"


# Define the IP addresses for the Prometheus subnet
[prometheus.hydrogen]
caddy.ip = "10.80.1.2"
caddy.port = "9117"

registry.ip = "10.80.1.3"
registry.port = "9103"

overleaf.ip = "10.80.1.4"
overleaf.port = "9101"

maddy.ip = "10.80.1.5"
maddy.port = "9749"

woodpecker.ip = "10.80.1.6"
woodpecker.port = "9102"

node.ip = "10.80.1.7"
node.port = "9100"

podman.port = "9882"
podman.web.ip = "10.80.1.8"
podman.woodpecker.ip = "10.80.1.9"

knot.ip = "10.80.1.11"
knot.port = "9434"

dmarc-metrics.ip = "10.80.1.12"
dmarc-metrics.port = "9797"

openwrt.port = "9103"

victoria-logs.ip = "10.80.1.13"
victoria-logs.port = "9428"

victoria-metrics.ip = "127.0.0.1"
victoria-metrics.port = "9090"


[email]
# Define the IP addresses for the email server
ipv4 = "10.80.1.254"


[wireguard.home]
# Define the IP addresses for the WireGuard VPN
subnet.ipv4 = ["10.77.0.0/16", "10.78.1.0/24"]
subnet.ipv6 = ["fd77:0:0:77::/64", "fd77:0:0:78::/64"]

self.ipv4 = "10.78.1.4"
self.ipv6 = "fd77:0:0:78::4"


[wireguard.mesh]
subnet.ipv4 = "10.80.0.0/16"
subnet.ipv6 = "fd80:80::/48"

hydrogen.ipv4 = "10.80.1.0/24"
hydrogen.ipv6 = "fd80:80::1:0/120"

helium.ipv4 = "10.80.2.0/24"
helium.ipv6 = "fd80:80::2:0/120"

lithium.ipv4 = "10.80.3.0/24"
lithium.ipv6 = "fd80:80::3:0/120"

boron.ipv4 = "10.80.4.0/24"
boron.ipv6 = "fd80:80::4:0/120"

# (carbon has no VPN connection)

[victoria-logs]
# The port used to append logs
ip = "10.80.1.13"
port = "21660"

# The port that Victoria Logs will listen on for syslog messages
syslog = "514"


[filesystems]
# The UUIDs for the filesystems used by the system
root = "54b902ba-941a-495f-ae19-770ee22681c4"
boot = "26d65031-c51b-4e2c-999f-9642f90ebcab"
efi = "312A-0AD0"
swap = "25c85fb7-eadd-414c-9c56-475bf2a401f4"


# systemd resource control priorities
[priorities]
lowest = """
CPUSchedulingPolicy=idle
CPUWeight=1
CPUQuota=150%

IOSchedulingClass=idle
IOSchedulingPriority=7
IOWeight=1
Nice=19

MemoryMax=6G
"""

low = """
CPUSchedulingPolicy=batch
CPUWeight=20
CPUQuota=350%

IOSchedulingClass=best-effort
IOSchedulingPriority=5
IOWeight=20
Nice=10

MemoryMax=10G
"""

high = """
CPUSchedulingPolicy=other
CPUWeight=200
CPUQuota=

IOSchedulingClass=best-effort
IOSchedulingPriority=3
IOWeight=200
Nice=-5

MemoryMax=12G
"""
