[engine]
# Set the default compression format.
compression_format = "zstd:chunked"
compression_level = 15

# Reduce health check logging.
healthcheck_events = false

# Pull more layers in parallel.
image_parallel_copies = 16

[containers]
# Needed for SELinux user_u to be able to run containers.
label_users = true

# Make the user namespace constant and well-known, and isolated from the host.
userns = "nomap"

# Use the container name as the hostname instead of the random container ID.
container_name_as_hostname = true

# Don't log everything as an error.
log_driver = "passthrough"

# Use the local timezone.
tz = "local"

# Restrict SUID.
no_new_privileges = true

[network]
# Preserve source IP addresses.
rootless_port_forwarder = "pasta"
