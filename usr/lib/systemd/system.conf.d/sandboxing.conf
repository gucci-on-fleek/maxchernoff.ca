[Manager]
# Allow all users to decrease their nice levels
DefaultLimitNICE=-5

# Sandboxing
SystemCallArchitectures=native
CapabilityBoundingSet=~\
    CAP_MAC_ADMIN \
    CAP_MAC_OVERRIDE \
    CAP_SYS_PACCT \
    CAP_SYS_RAWIO

DefaultRestrictSUIDSGID=true
ManagerEnvironment=SYSTEMD_PAGERSECURE=true
