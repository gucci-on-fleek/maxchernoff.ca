[Manager]
# Decrease the default timeouts
DefaultTimeoutStopSec=15s
DefaultDeviceTimeoutSec=15s
DefaultTimeoutStartSec=15s

# Wait 1 second before restarting failed services
DefaultRestartSec=1s

# Reboot if systemd itself crashes
CrashAction=reboot
