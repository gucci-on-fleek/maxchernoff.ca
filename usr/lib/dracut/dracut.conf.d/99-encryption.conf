# Enable unlocking the root filesystem over the network with Clevis and Tang
add_dracutmodules+=" clevis-pin-tang clevis-pin-sss "

# Allow Clevis to connect to the network from the initramfs
add_dracutmodules+=" systemd-networkd systemd-resolved "

# Enable encrypted swap
add_dracutmodules+=" custom-encrypted-swap "
