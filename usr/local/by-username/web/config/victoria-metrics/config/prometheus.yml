global:
  scrape_interval: 30s

scrape_configs:
  - job_name: "victoria-metrics"
    metric_relabel_configs: &metric_relabel_configs
      - source_labels: [__name__]
        action: drop
        regex: "^(go|nodejs|openfga|process|promhttp|python|timer_event_loop)_.*"
    static_configs:
      - targets:
          - "victoria-metrics.metrics.hydrogen.duck.tel:9090"

  - job_name: "caddy"
    metric_relabel_configs:
      - source_labels: [__name__]
        action: drop
        regex: "^(go|nodejs|openfga|promhttp|python|timer_event_loop)_.*"

      - source_labels: [host]
        target_label: original_host

      - source_labels: [host]
        target_label: host
        action: replace
        regex: "([^:]+):([^:]+)"
        replacement: "$1"

      - source_labels: [host]
        regex: "^$|^(!!network.hydrogen.ipv4!!|\\[?!!network.hydrogen.ipv6!!\\]?)$|^(.*\\.)?(maxchernoff\\.ca|duck\\.tel)$"
        action: keep

    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "caddy.metrics.hydrogen.duck.tel:9100"

  - job_name: "caddy-cache"
    metric_relabel_configs: *metric_relabel_configs
    metrics_path: "/souin-api/metrics"
    static_configs:
      - targets:
          - "caddy.metrics.hydrogen.duck.tel:9100"

  - job_name: "container-registry"
    metric_relabel_configs: *metric_relabel_configs
    static_configs:
      - targets:
          - "container-registry.metrics.hydrogen.duck.tel:9100"

  - job_name: "overleaf"
    metric_relabel_configs: *metric_relabel_configs
    static_configs:
      - targets:
          - "overleaf.metrics.hydrogen.duck.tel:9100"

  - job_name: "maddy"
    metric_relabel_configs: *metric_relabel_configs
    static_configs:
      - targets:
          - "maddy.metrics.hydrogen.duck.tel:9100"

  - job_name: "woodpecker"
    metric_relabel_configs: *metric_relabel_configs
    static_configs:
      - targets:
          - "woodpecker.metrics.hydrogen.duck.tel:9100"

  - job_name: "node"
    metric_relabel_configs: *metric_relabel_configs
    static_configs:
      - targets:
          - "node-exporter.metrics.hydrogen.duck.tel:9100"
          - "max-new-laptop.rd.duck.tel:9100"

  - job_name: "podman"
    metric_relabel_configs: *metric_relabel_configs
    static_configs:
      - targets:
          - "podman-web.metrics.hydrogen.duck.tel:9100"
          - "podman-woodpecker.metrics.hydrogen.duck.tel:9100"

  - job_name: "knot"
    metric_relabel_configs: *metric_relabel_configs
    static_configs:
      - targets:
          - "knot.metrics.hydrogen.duck.tel:9100"

  - job_name: "grafana"
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: "^(grafana_api_dashboard|grafana_api_response|grafana_apiserver|grafana_build_info|grafana_database|grafana_datasource|grafana_db|grafana_folder|grafana_http|grafana_live|grafana_plugin|grafana_prometheus|grafana_stat).*"
    static_configs:
      - targets:
          - "systemd-grafana:3000"

  - job_name: "dmarc-metrics"
    metric_relabel_configs: *metric_relabel_configs
    static_configs:
      - targets:
          - "dmarc.metrics.hydrogen.duck.tel:9100"

  - job_name: "openwrt"
    metric_relabel_configs:
      - source_labels: ["type"]
        target_label: "device"
        action: replace
        regex: "^(rx|tx)_(.*)$"
        replacement: "$2"

      - source_labels: ["type"]
        target_label: "direction"
        action: replace
        regex: "^(rx|tx)_(.*)$"
        replacement: "$1"
    static_configs:
      - targets:
          - "rd.duck.tel:9103"
          - "wifi-ap.rd.duck.tel:9103"

  - job_name: "victoria-logs"
    metric_relabel_configs: *metric_relabel_configs
    static_configs:
      - targets:
          - "victoria-logs.metrics.hydrogen.duck.tel:9100"
