# Initialize the directory structure below /var/etc/ so that we can store some
# customized per-system configuration files.
#Type  Path                                Mode  User  Group  Age  Argument
d      /var/etc/                           755   root  root   -    -
d      /var/etc/credstore/                 600   root  root   -    -
d      /var/etc/ssh/                       600   root  root   -    -
d      /var/etc/systemd/system/-.slice.d/  644   root  root   -    -
d      /var/etc/userdb/                    600   root  root   -    -
f      /var/etc/hostname                   644   root  root   -    -

# We want to manually set the password after the first boot, so only copy the
# password files once, and then never again.
#Type  Path                                  Mode  User  Group  Age  Argument
C+     /var/etc/userdb/1000.user-privileged  600   -     -      -    -
C+     /var/etc/userdb/max.user-privileged   600   -     -      -    -
