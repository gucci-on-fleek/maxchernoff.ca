[Manager]
# Decrease the default timeouts
DefaultTimeoutStopSec=10s
DefaultDeviceTimeoutSec=10s
DefaultTimeoutStartSec=10s

# Wait 1 second before restarting failed services
DefaultRestartSec=1s

# Enable the watchdog
RuntimeWatchdogSec=1min
RebootWatchdogSec=1min
KExecWatchdogSec=1min

# Reboot if systemd itself crashes
CrashAction=reboot
