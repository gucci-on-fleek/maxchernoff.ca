# Clone the repository and expand the variables.
[Service]
ExecStart=
ExecStart=git clone https://github.com/gucci-on-fleek/maxchernoff.ca.git /var/lib/repo
ExecStart=sh -c "printf '[filter \"git-filter-params\"]\\n\\tprocess = git-filter-params ./variables.toml\\n\\trequired' >> /var/lib/repo/.git/config"
ExecStart=rm --force /var/lib/repo/.git/index
ExecStart=env PATH=/var/lib/repo/usr/local/bin/:/usr/bin git -C /var/lib/repo reset --hard @
