[Service]
# Restrict all capabilities, but allow performance monitoring.
CapabilityBoundingSet=CAP_PERFMON

# Restrict filesystem access
ProtectSystem=strict

# Restrict network and process access
PrivateIPC=true
ProtectProc=invisible
RestrictAddressFamilies=AF_NETLINK AF_VSOCK

# Restrict system calls
LockPersonality=true
SystemCallFilter=@system-service @reboot
SystemCallFilter=~@cpu-emulation @debug @module @obsolete @pkey @raw-io @swap
SystemCallErrorNumber=EPERM
SystemCallArchitectures=native
RestrictRealtime=true
