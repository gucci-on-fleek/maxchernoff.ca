[Unit]
ConditionUser=|web
ConditionUser=|woodpecker

[Service]
EnvironmentFile=/usr/local/share/metrics-addresses/%H-%u.conf

ExecStart=
ExecStart=/usr/bin/prometheus-podman-exporter \
    --collector.enable-all \
    --collector.enhance-metrics \
    --web.listen-address=${metrics_podman_ip}:9100
